name: API tests and security scans

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run API tests
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/pytest.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-report
          path: reports/pytest.xml
          if-no-files-found: error
          retention-days: 30

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Scan application source
        run: |
          mkdir -p reports
          python -m bandit app.py -f json -o reports/bandit.json
      - name: Save SAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-sast-report
          path: reports/bandit.json
          if-no-files-found: error
          retention-days: 30

  sca:
    name: SCA - Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Add the SNYK_TOKEN repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        with:
          snyk-version: v1.1308.1
      - name: Scan runtime and development dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          snyk test --file=requirements-dev.txt --package-manager=pip --command=python --json-file-output=reports/snyk.json
      - name: Save SCA report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snyk-sca-report
          path: reports/snyk.json
          if-no-files-found: error
          retention-days: 30
